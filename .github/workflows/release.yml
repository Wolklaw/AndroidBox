name: Release

# Every push to main that raises the version in androidbox/__init__.py builds the installer and publishes it as a
# release. Installed copies of Androidbox look for the newest release and offer to update themselves from it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and see whether it is already released
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path androidbox/__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          gh release view "v$version" --json tagName *> $null
          $released = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "released=$released" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, already released: $released"
          # gh exits with 1 when the release does not exist yet, and that must not fail the step
          exit 0

      - uses: actions/setup-python@v5
        if: steps.version.outputs.released == 'false'
        with:
          python-version: "3.13"

      - name: Install the app's requirements and run its tests
        if: steps.version.outputs.released == 'false'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover tests -v
          if ($LASTEXITCODE -ne 0) { throw "The tests failed" }

      - name: Install Inno Setup
        if: steps.version.outputs.released == 'false'
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno Setup did not install" }

      - name: Build the app and the installer
        if: steps.version.outputs.released == 'false'
        shell: pwsh
        run: ./build.ps1

      - name: Check that the built app starts
        if: steps.version.outputs.released == 'false'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:ANDROIDBOX_HOME = Join-Path $env:RUNNER_TEMP "androidbox-smoke"
          $app = Start-Process -FilePath "dist\Androidbox\Androidbox.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "The built app quit on start, with exit code $($app.ExitCode)" }
          if (Test-Path (Join-Path $env:ANDROIDBOX_HOME "data\crash.log")) {
            Get-Content (Join-Path $env:ANDROIDBOX_HOME "data\crash.log")
            throw "The built app crashed on start"
          }
          Stop-Process -Id $app.Id -Force

      - name: Publish the release
        if: steps.version.outputs.released == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $previous = gh release view --json tagName --jq .tagName 2>$null
          # The newest release's tag may not be in this checkout, and then there is nothing to compare against
          if ($previous) { git rev-parse --verify --quiet "refs/tags/$previous" *> $null; if ($LASTEXITCODE -ne 0) { $previous = $null } }
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          $changes = (git log $range --no-merges --format="- %s" | Out-String).Trim()
          # The app shows only the first 600 characters, and copies still running as DroidCore need this most
          $notes = "Press Download, then open the installer from the page. Your instances and settings are kept.`n`n$changes"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          $installer = "dist/Androidbox-Setup-$version.exe"
          gh release view "v$version" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            # Someone published this version while the build ran: add the installer to that release, don't fail
            gh release upload "v$version" $installer --clobber
          } else {
            gh release create "v$version" $installer --title "Androidbox $version" --notes-file notes.md --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
