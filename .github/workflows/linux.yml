name: Linux

# Checks the Linux build on every push and pull request: the tests, the install script, and that the installed app
# starts. It publishes nothing. Releases of the Windows installer stay in release.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the libraries Qt and SDL load
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 \
            libfontconfig1 libsdl2-2.0-0 xvfb

      - name: Run the tests
        run: |
          python -m pip install -r requirements.txt
          QT_QPA_PLATFORM=offscreen python -m unittest discover tests -v

      - name: Install it the way SparkOS does, for the current user
        run: bash packaging/linux/install.sh --user

      - name: Start the installed app
        run: |
          export ANDROIDBOX_HOME="$RUNNER_TEMP/androidbox-smoke"
          export QT_QPA_PLATFORM=offscreen
          "$HOME/.local/bin/androidbox" &
          app=$!
          sleep 12
          if ! kill -0 "$app" 2>/dev/null; then echo "The app quit on start"; exit 1; fi
          if [ -f "$ANDROIDBOX_HOME/data/crash.log" ]; then cat "$ANDROIDBOX_HOME/data/crash.log"; exit 1; fi
          kill "$app"

      - name: Use the command line
        run: |
          export ANDROIDBOX_HOME="$RUNNER_TEMP/androidbox-cli"
          mkdir -p "$ANDROIDBOX_HOME"
          "$HOME/.local/bin/androidbox" --version
          test "$("$HOME/.local/bin/androidbox" list --json)" = "[]"
          "$HOME/.local/bin/androidbox" start nothing-here && exit 1 || echo "An unknown instance fails, as it should"

      - name: Remove it again
        run: bash packaging/linux/install.sh --user --uninstall

  # The SparkOS base (Bazzite on Fedora), whose newest Python is too new for Qt's packages: this is the
  # install the SparkOS image build runs, as root, with --deps
  fedora:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@v4

      - name: Install it the way the SparkOS image does
        run: bash packaging/linux/install.sh --deps

      - name: Start the installed app
        run: |
          export ANDROIDBOX_HOME="$RUNNER_TEMP/androidbox-smoke"
          export QT_QPA_PLATFORM=offscreen
          androidbox --version
          /usr/bin/androidbox &
          app=$!
          sleep 12
          if ! kill -0 "$app" 2>/dev/null; then echo "The app quit on start"; exit 1; fi
          if [ -f "$ANDROIDBOX_HOME/data/crash.log" ]; then cat "$ANDROIDBOX_HOME/data/crash.log"; exit 1; fi
          kill "$app"
          # The Python that got used, for the record
          /usr/lib/androidbox/venv/bin/python --version
