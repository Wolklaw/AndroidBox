name: Bug report
description: Something in Androidbox doesn't work
body:
  - type: input
    id: version
    attributes:
      label: Androidbox version
      description: Shown at the bottom of Settings
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version of the instance
      placeholder: Android 16
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Export diagnostics from the instance's page and attach the zip. Proxy logins are hidden in it. If it's a proxy problem, press Test next to the proxy setting and paste the message.
